[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapture-instrumentation"
dynamic = ["version"]
description = "Instrumentation for common Python packages, applied through wrapture."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Graham Dumpleton", email = "Graham.Dumpleton@gmail.com"}
]
requires-python = ">=3.12"
keywords = ["wrapture", "instrumentation", "monkey patching", "tracing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
# wrapture is the only dependency, ever. An instrumentation package
# never depends on the packages it instruments: installing it must not
# install Flask, and whether a target is present and at a supported
# version is checked by wrapture at apply time from the class data.
dependencies = [
    "wrapture>=1.0.0a19",
]

[project.urls]
Homepage = "https://github.com/GrahamDumpleton/wrapture-instrumentation"
Documentation = "https://wrapture.readthedocs.io"
"Bug Tracker" = "https://github.com/GrahamDumpleton/wrapture-instrumentation/issues/"

# One entry per target, the entry point name being the bare target
# name the config's [[instrument]] entry uses. The group name has a
# dot in it, hence the quoted header.
[project.entry-points."wrapture.instrumentation"]
"aiohttp.client" = "wrapture_instrumentation.external.aiohttp_client:AiohttpClientInstrumentation"
"aiohttp.web" = "wrapture_instrumentation.server.aiohttp_web:AiohttpWebInstrumentation"
django = "wrapture_instrumentation.framework.django:DjangoInstrumentation"
fastapi = "wrapture_instrumentation.framework.fastapi:FastAPIInstrumentation"
flask = "wrapture_instrumentation.framework.flask:FlaskInstrumentation"
grpc = "wrapture_instrumentation.rpc.grpc:GRPCInstrumentation"
"http.client" = "wrapture_instrumentation.external.http_client:HTTPClientInstrumentation"
httpx = "wrapture_instrumentation.external.httpx:HTTPXInstrumentation"
jinja2 = "wrapture_instrumentation.template.jinja2:Jinja2Instrumentation"
requests = "wrapture_instrumentation.external.requests:RequestsInstrumentation"
sqlalchemy = "wrapture_instrumentation.database.sqlalchemy:SQLAlchemyInstrumentation"
sqlite3 = "wrapture_instrumentation.database.sqlite3:SQLite3Instrumentation"
starlette = "wrapture_instrumentation.framework.starlette:StarletteInstrumentation"
"urllib.request" = "wrapture_instrumentation.external.urllib_request:UrllibInstrumentation"
urllib3 = "wrapture_instrumentation.external.urllib3:Urllib3Instrumentation"
uvicorn = "wrapture_instrumentation.server.uvicorn:UvicornInstrumentation"
"werkzeug.serving" = "wrapture_instrumentation.server.werkzeug_serving:WerkzeugServingInstrumentation"
"wsgiref.simple_server" = "wrapture_instrumentation.server.wsgiref_simple_server:WSGIRefSimpleServerInstrumentation"
"xmlrpc.client" = "wrapture_instrumentation.external.xmlrpc_client:XMLRPCClientInstrumentation"
"xmlrpc.server" = "wrapture_instrumentation.server.xmlrpc_server:XMLRPCServerInstrumentation"

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
wrapture_instrumentation = ["py.typed", "*/*/README.md"]

[tool.setuptools.dynamic]
version = {attr = "wrapture_instrumentation.__version__"}

[dependency-groups]
# The test group carries every target the tests need, at whatever
# version the lock resolves; older versions of a target are overlaid
# per run by the Justfile's per-target matrix recipes.
test = [
    "aiohttp",
    # greenlet, which sqlalchemy pulls in, has no wheel for the free
    # threaded 3.13 build and fails to compile there; a marker cannot
    # single out a free threaded build, so both 3.13 builds go
    # without, and the sqlalchemy suite skips itself where the
    # import fails.
    "aiosqlite; python_version != '3.13'",
    "django",
    "fastapi",
    "flask",
    "httpx",
    "jinja2",
    "pytest",
    "requests",
    "sqlalchemy; python_version != '3.13'",
    "starlette",
    "urllib3",
    "uvicorn",
]
dev = [
    {include-group = "test"},
    # grpcio ships no free threaded or 3.15 wheels, so it lives in
    # the dev group only: synced on the default Python, never on
    # the full test matrix, whose grpc suite skips itself instead.
    "grpcio",
    "mypy",
    "ruff",
    "setuptools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wrapture_instrumentation", "tests", "demo"]

# grpcio ships no type information; its objects cross this package
# through Any-typed hook modules anyway, and the interceptor and
# handler classes necessarily subclass grpc's (Any-typed) bases.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# Django ships no inline types either (django-stubs is a separate
# project); the patch modules import it lazily so most of it is Any
# already, and the test app's model and class-based view necessarily
# subclass its (Any-typed) bases.
[[tool.mypy.overrides]]
module = ["django", "django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "wrapture_instrumentation.rpc.grpc.interceptors",
    "tests.rpc.grpc.service",
    "tests.framework.django.shop.models",
    "tests.framework.django.shop.views",
]
disallow_subclassing_any = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["wrapture_instrumentation"]

# The sqlalchemy suite guards its imports behind importorskip, so its
# module-level imports legitimately follow that statement.
[tool.ruff.lint.per-file-ignores]
"tests/database/sqlalchemy/*" = ["E402"]
"tests/rpc/grpc/*" = ["E402"]
