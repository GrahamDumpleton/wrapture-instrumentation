name: Build, test and create release packages.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-default-groups --group test pytest

  # Each target's suite against the other supported versions of that
  # target, overlaid on the project environment as the Justfile's
  # per-target recipes do; the lock's version is covered by the test
  # job above. Keep these lists in step with the Justfile.
  test-targets:
    name: Test ${{ matrix.target }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aiohttp
            suite: external/aiohttp_client tests/server/aiohttp_web
            version: "3.10.11"
          - target: aiohttp
            suite: external/aiohttp_client tests/server/aiohttp_web
            version: "3.11.18"
          - target: django
            suite: framework/django
            version: "4.2.30"
          - target: django
            suite: framework/django
            version: "5.2.17"
          - target: django
            suite: framework/django
            version: "6.0.8"
          - target: fastapi
            suite: framework/fastapi
            version: "0.110.3"
          - target: fastapi
            suite: framework/fastapi
            version: "0.126.0"
          - target: flask
            suite: framework/flask
            version: "3.0.3"
          - target: flask
            suite: framework/flask
            version: "3.1.3"
          - target: grpcio
            suite: rpc/grpc
            version: "1.76.0"
          - target: grpcio
            suite: rpc/grpc
            version: "1.83.1"
          - target: httpx
            suite: external/httpx
            version: "0.27.2"
          - target: httpx
            suite: external/httpx
            version: "0.28.1"
          - target: jinja2
            suite: template/jinja2
            version: "3.0.3"
          - target: jinja2
            suite: template/jinja2
            version: "3.1.6"
          - target: requests
            suite: external/requests
            version: "2.31.0"
          - target: requests
            suite: external/requests
            version: "2.32.5"
          - target: sqlalchemy
            suite: database/sqlalchemy
            version: "1.4.54"
          - target: sqlalchemy
            suite: database/sqlalchemy
            version: "2.0.36"
          - target: starlette
            suite: framework/starlette
            version: "0.47.0"
          - target: starlette
            suite: framework/starlette
            version: "1.0.0"
          - target: urllib3
            suite: external/urllib3
            version: "1.26.20"
          - target: urllib3
            suite: external/urllib3
            version: "2.0.7"
          - target: uvicorn
            suite: server/uvicorn
            version: "0.30.0"
          - target: uvicorn
            suite: server/uvicorn
            version: "0.52.4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run the ${{ matrix.suite }} suite against ${{ matrix.target }} ${{ matrix.version }}
        run: uv run --no-default-groups --group test --with "${{ matrix.target }}==${{ matrix.version }}" pytest tests/${{ matrix.suite }}

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Check code with ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check with mypy
        run: uv run mypy

  build:
    name: Build sdist and wheel
    needs:
      - test
      - test-targets
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build source distribution and wheel
        run: uv build

      - name: List built artifacts
        run: ls -las dist

      - name: Store built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Resolve version and prerelease status
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG}"
          BASE_VERSION="$(echo "$VERSION" | sed -E 's/\.?(dev|a|b|rc)[0-9]+$//')"
          ANCHOR="version-$(echo "$BASE_VERSION" | tr -d '.')"
          if [[ "$VERSION" != "$BASE_VERSION" ]]; then
              PRERELEASE="true"
          else
              PRERELEASE="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        run: |
          EXPECTED="${{ steps.meta.outputs.version }}"
          ACTUAL="$(uv run --no-default-groups python -c 'import wrapture_instrumentation; print(wrapture_instrumentation.__version__)')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Tag version ($EXPECTED) does not match __version__ ($ACTUAL) in src/wrapture_instrumentation/__init__.py" >&2
              exit 1
          fi
          echo "Version match: $ACTUAL"

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -las dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes body
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BASE_VERSION="${{ steps.meta.outputs.base_version }}"
          ANCHOR="${{ steps.meta.outputs.anchor }}"
          DOCS_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGES.md#${ANCHOR}"
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              cat > body.md <<EOF
          Preview release. Release notes for the upcoming ${BASE_VERSION}
          final (work in progress): ${DOCS_URL}

          May be installable from PyPi:

              pip install wrapture-instrumentation==${VERSION}

          If \`pip\` reports the version is unavailable, this preview has
          not been uploaded. The wheel and source distribution are
          attached, together with \`SHA256SUMS\` for verification.
          EOF
          else
              cat > body.md <<EOF
          Full release notes: ${DOCS_URL}

          Install from PyPi (recommended):

              pip install wrapture-instrumentation==${VERSION}

          PyPi uploads follow each GitHub release; if \`pip\` reports the
          version is unavailable, the matching PyPi upload may not have
          happened yet. The wheel and source distribution are attached,
          together with \`SHA256SUMS\` for verification.
          EOF
          fi
          cat body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              FLAGS+=("--prerelease")
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
              --title "wrapture-instrumentation ${{ steps.meta.outputs.version }}" \
              --notes-file body.md \
              "${FLAGS[@]}" \
              dist/*

  publish:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
